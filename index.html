<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>A Portrait Made From Comic Book Covers</title>
<style>
  :root{ --ink:#f6f3ec; --quiet:#8a8884; --field:#111113; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--field);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    overscroll-behavior:none;}
  #osd{position:fixed;inset:0;background:var(--field);}
  header{position:fixed;top:0;left:0;right:0;z-index:5;padding:14px 18px;
    background:linear-gradient(180deg,rgba(17,17,19,.92),rgba(17,17,19,0));
    pointer-events:none;}
  h1{margin:0;font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;}
  @media (max-width:430px){ h1{font-size:10.5px;letter-spacing:.14em} p{font-size:10.5px} }
  p{margin:5px 0 0;font-size:12px;color:var(--quiet);letter-spacing:.04em;}
  footer{position:fixed;bottom:0;left:0;right:0;z-index:5;padding:14px 18px;text-align:center;
    background:linear-gradient(0deg,rgba(17,17,19,.92),rgba(17,17,19,0));
    font-size:11.5px;color:var(--quiet);letter-spacing:.06em;pointer-events:none;}
  .bars{display:flex;gap:4px;justify-content:center;margin-top:8px}
  .bars i{width:16px;height:5px;display:block}
  #hint{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:14px 20px;border:1px solid rgba(246,243,236,.22);border-radius:3px;
    background:rgba(17,17,19,.82);font-size:12.5px;letter-spacing:.08em;
    transition:opacity .6s;text-align:center;pointer-events:none}
  .osd-btn{filter:invert(1) opacity(.55)}
</style>
</head>
<body>
<div id="osd"></div>
<header>
  <h1>A Portrait Made From Comic Book Covers</h1>
  <p>2,999 covers &middot; 12,000 &times; 17,000 pixels</p>
</header>
<div id="hint">Pinch or scroll to zoom in on any single cover</div>
<footer>
  Double-tap to zoom &middot; drag to pan
  <span class="bars"><i style="background:#00aeef"></i><i style="background:#ec008c"></i><i style="background:#fff100"></i><i style="background:#6b6b6d"></i></span>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
<script>
  var v = OpenSeadragon({
    id: "osd",
    prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
    tileSources: "mosaic.dzi",
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: "BOTTOM_RIGHT",
    navigatorHeight: 96, navigatorWidth: 68,
    maxZoomPixelRatio: 2.2,
    minZoomImageRatio: 0.85,
    visibilityRatio: 1,
    constrainDuringPan: true,
    springStiffness: 8,
    gestureSettingsTouch: { pinchRotate: false },
    zoomPerScroll: 1.4
  });
  var hint = document.getElementById("hint");
  function hideHint(){ hint.style.opacity = 0; setTimeout(function(){ hint.remove(); }, 700); }
  v.addOnceHandler("canvas-drag", hideHint);
  v.addOnceHandler("zoom", hideHint);
  setTimeout(hideHint, 5200);
</script>
</body>
</html>
